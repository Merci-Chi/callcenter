<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#102945" />
  <title>Outreach</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <h1>Outreach</h1>
      <div class="status-pill"><i data-lucide="circle-check"></i> On Track</div>
    </div>
    <div class="stat-grid" style="margin-top:18px">
      <div class="stat-card green"><i data-lucide="phone-call"></i><div class="num" id="statCalls">—</div><div class="label">Calls Today</div></div>
      <div class="stat-card purple"><i data-lucide="rotate-ccw"></i><div class="num" id="statCallbacks">—</div><div class="label">Callbacks</div></div>
      <div class="stat-card orange"><i data-lucide="flame"></i><div class="num" id="statInterested">—</div><div class="label">Interested</div></div>
    </div>
  </header>

  <main class="content">
    <div class="crm-toolbar"><input type="search" id="crmSearch" aria-label="Search business previews" placeholder="Search business, phone, or notes…" autocomplete="off" /><button id="crmReload" type="button" title="Refresh"><i data-lucide="refresh-cw"></i></button></div>
    <div class="filter-row">
      <button class="pill active">All Previews</button>
      <button class="pill">Due for Follow Up</button>
      <button class="pill">High Priority</button>
    </div>

    <section class="crm-state card" id="crmStatus" aria-live="polite">Connecting to CRM…</section>
    <div id="crmLeadCards" class="crm-leads" aria-live="polite"></div>
  </main>

  <nav class="bottom-nav">
    <a class="nav-item active" href="index.html"><i data-lucide="phone"></i><span>Outreach</span></a>
    <a class="nav-item" href="skills.html"><i data-lucide="chart-no-axes-column-increasing"></i><span>Skills</span></a>
    <a class="nav-item" href="earnings.html"><i data-lucide="circle-dollar-sign"></i><span>Earnings</span></a>
    <a class="nav-item" href="activity.html"><i data-lucide="history"></i><span>Activity</span></a>
    <a class="nav-item" href="account.html"><i data-lucide="user-round"></i><span>Account</span></a>
  </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-guard.js"></script>
<script src="user-data.js?v=20261001-1918"></script>
<script src="app.js?v=20261001-1918"></script>
</body>
</html>
