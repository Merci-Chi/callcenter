<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#102945" />
  <title>Call</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="styles.css?v=20261001-leadworkspace" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app call-app">
  <header class="call-topbar">
    <button class="call-round-btn" id="callBack" aria-label="Back"><i data-lucide="chevron-left"></i></button>
    <h1 id="callCompanyHeader">Business</h1>
    <button class="call-round-btn call-business-icon" aria-label="Business"><i data-lucide="building-2"></i></button>
  </header>

  <main class="call-content">
    <section class="call-identity">
      <div class="call-avatar"><i data-lucide="user-round"></i></div>
      <div class="call-number" id="callNumber">(000) 000-0000</div>
      <div class="call-company" id="callCompany">Business</div>
      <div class="call-status" data-state="idle"><i id="callStatusIcon" data-lucide="phone"></i><strong id="callStatusText">Ready</strong><span id="callTimerWrap" hidden>· <span id="callTimer">00:00</span></span></div>
    </section>

    <section class="call-action-grid call-action-grid-six">
      <button class="call-action-card" data-call-action="Alerts"><span class="call-action-icon"><i data-lucide="bell"></i></span><span>Alerts</span></button>
      <button class="call-action-card" data-call-action="Tags"><span class="call-action-icon"><i data-lucide="tag"></i></span><span>Tags</span></button>
      <button class="call-action-card" data-call-action="Notes"><span class="call-action-icon"><i data-lucide="notebook-pen"></i></span><span>Notes</span></button>
      <button class="call-action-card" data-call-action="Send Site Preview"><span class="call-action-icon"><i data-lucide="send"></i></span><span>Send Site Preview</span></button>
      <button class="call-action-card" data-call-action="Templates"><span class="call-action-icon"><i data-lucide="messages-square"></i></span><span>Templates</span></button>
      <button class="call-action-card" data-call-action="Quick Info"><span class="call-action-icon"><i data-lucide="circle-dollar-sign"></i></span><span>Quick Info</span></button>
    </section>
    <section class="call-controls">
      <button class="call-control small" id="muteBtn"><i data-lucide="mic"></i><span>Mute</span></button>
      <button class="call-control start-call" id="hangupBtn" aria-label="Start call"><i data-lucide="phone"></i><span>Start Call</span></button>
      <button class="call-control small" id="holdBtn"><i data-lucide="pause"></i><span>Hold</span></button>
    </section>
    <section class="call-transcript-section transcript-waiting" id="transcriptSection">
      <h2>Transcript</h2>
      <div class="call-transcript-card">
        <div class="transcript-entry">
          <div class="transcript-meta"><span>00:08</span><strong>You</strong></div>
          <div class="transcript-bubble muted">Hi, this is Alex. I’m calling because I wanted to show you a website preview I put together.</div>
        </div>
        <div class="transcript-entry">
          <div class="transcript-meta"><span>00:24</span><strong id="prospectLabel">Prospect</strong></div>
          <div class="transcript-bubble prospect">Yeah, absolutely. I’m interested in hearing a little more about it.</div>
        </div>
        <div class="transcript-listening"><i data-lucide="audio-lines"></i><span>Listening...</span><i data-lucide="ellipsis"></i></div>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-guard.js"></script>
<script src="user-data.js?v=20261001-leadworkspace"></script>
<script src="app.js?v=20261001-leadworkspace"></script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const company = params.get('company') || 'Business';
  const contact = params.get('contact') || 'Prospect';
  const number = params.get('number') || '(000) 000-0000';
  const previewUrl = params.get('preview') || '';
  const crmId = params.get('crm_id') || '';

  const header = document.getElementById('callCompanyHeader');
  const companyEl = document.getElementById('callCompany');
  const numberEl = document.getElementById('callNumber');
  const prospectEl = document.getElementById('prospectLabel');
  const statusText = document.getElementById('callStatusText');
  const timerWrap = document.getElementById('callTimerWrap');
  const timer = document.getElementById('callTimer');
  const statusIcon = document.getElementById('callStatusIcon');
  const transcript = document.getElementById('transcriptSection');

  header.textContent = company;
  companyEl.textContent = company;
  numberEl.textContent = number;
  prospectEl.textContent = contact || 'Prospect';

  document.getElementById('callBack').addEventListener('click', () => {
    history.length > 1 ? history.back() : location.href='index.html';
  });

  let callState = 'idle';
  let connectedSeconds = 0;
  let timerTick = null;
  let stateTimers = [];
  let questionnaireOpen = false;

  function setState(state){
    callState = state;
    const map = {
      idle: 'Ready',
      calling: 'Calling…',
      ringing: 'Ringing…',
      connected: 'Connected',
      ended: 'Call Ended'
    };
    statusText.textContent = map[state] || state;
    document.querySelector('.call-status').dataset.state = state;

    if(state === 'connected'){
      timerWrap.hidden = false;
      transcript.classList.remove('transcript-waiting');
      if(!timerTick){
        timerTick = setInterval(() => {
          connectedSeconds++;
          const m = String(Math.floor(connectedSeconds/60)).padStart(2,'0');
          const s = String(connectedSeconds%60).padStart(2,'0');
          timer.textContent = `${m}:${s}`;
        },1000);
      }
    } else {
      timerWrap.hidden = true;
      if(state === 'calling' || state === 'ringing') transcript.classList.add('transcript-waiting');
    }
  }

  setState('idle');

  function stopCall(){
    stateTimers.forEach(clearTimeout);
    stateTimers = [];
    if(timerTick) clearInterval(timerTick);
    timerTick = null;
    setState('ended');
  }

  const mainCallButton = document.getElementById('hangupBtn');

  function syncMainCallButton(){
    const active = ['calling','ringing','connected'].includes(callState);
    mainCallButton.classList.toggle('start-call', !active);
    mainCallButton.classList.toggle('hangup', active);
    mainCallButton.setAttribute('aria-label', active ? 'End call' : 'Start call');
    mainCallButton.innerHTML = active
      ? '<i data-lucide="phone-off"></i><span>End Call</span>'
      : '<i data-lucide="phone"></i><span>Start Call</span>';
    lucide.createIcons();
  }

  function startCall(){
    stateTimers.forEach(clearTimeout);
    stateTimers = [];
    connectedSeconds = 0;
    timer.textContent = '00:00';
    setState('calling');
    syncMainCallButton();
    stateTimers.push(setTimeout(() => setState('ringing'), 900));
    stateTimers.push(setTimeout(() => setState('connected'), 3000));
  }

  mainCallButton.addEventListener('click', () => {
    if(questionnaireOpen) return;
    if(callState === 'idle' || callState === 'ended'){ startCall(); return; }
    stopCall();
    syncMainCallButton();
    openPostCallFlow();
  });

  document.getElementById('muteBtn').addEventListener('click', function(){
    if(callState !== 'connected') return;
    this.classList.toggle('active');
    const span = this.querySelector('span');
    span.textContent = this.classList.contains('active') ? 'Unmute' : 'Mute';
    const icon = this.querySelector('i');
    icon.setAttribute('data-lucide', this.classList.contains('active') ? 'mic-off' : 'mic');
    lucide.createIcons();
  });

  syncMainCallButton();

  document.getElementById('holdBtn').addEventListener('click', function(){
    if(callState !== 'connected') return;
    this.classList.toggle('active');
    const span = this.querySelector('span');
    span.textContent = this.classList.contains('active') ? 'Resume' : 'Hold';
    const icon = this.querySelector('i');
    icon.setAttribute('data-lucide', this.classList.contains('active') ? 'play' : 'pause');
    lucide.createIcons();
  });

  document.querySelectorAll('[data-call-action]').forEach(btn => btn.addEventListener('click', () => {
    const label = btn.dataset.callAction;
    alert(label + ' panel can open here.');
  }));

  function openPostCallFlow(){
    questionnaireOpen = true;
    const overlay = document.createElement('div');
    overlay.className = 'post-call-overlay';
    overlay.innerHTML = `
      <div class="post-call-sheet" role="dialog" aria-modal="true" aria-label="Complete call">
        <div class="post-call-progress"><span></span></div>
        <div class="post-call-stage"></div>
      </div>`;
    document.body.appendChild(overlay);

    const stage = overlay.querySelector('.post-call-stage');
    const progress = overlay.querySelector('.post-call-progress span');
    const data = { rating:'', outcomes:[], reason:'', tags:[], notes:'', route:'' };
    let screenIndex = 0;
    let screens = [];

    const outcomeOptions = [
      ['Interested','sparkles'],
      ['Follow Up','calendar-clock'],
      ['Needs More Info','circle-help'],
      ['Not Interested','circle-x'],
      ['No Answer','phone-missed'],
      ['Voicemail','voicemail'],
      ['Busy','phone-call'],
      ['Wrong Number','ban']
    ];
    const reasonOptions = ['Too expensive','Already has someone','Not a priority','Doesn’t want a website','Bad timing','Not a fit','Other'];
    const tagOptions = ['Interested','Follow Up','Send Preview','Requested Text','Requested Email','Price Concern','Decision Maker','No Website','Busy','Do Not Call'];
    // Show the relevant five outcomes on What happened?; More opens the rest.
    const outcomeChoices = {
      Good: [
        ['Interested', 'sparkles'],
        ['Follow Up', 'calendar-clock'],
        ['Needs More Info', 'circle-help'],
        ['Send Preview', 'monitor'],
        ['Requested Email', 'mail']
      ],
      Bad: [
        ['Not Interested', 'circle-x'],
        ['No Answer', 'phone-missed'],
        ['Voicemail', 'voicemail'],
        ['Busy', 'phone-call'],
        ['Wrong Number', 'ban']
      ]
    };
    const extraOutcomes = [
      ['Already Has Someone', 'users'],
      ['Bad Timing', 'clock'],
      ['Price Concern', 'badge-dollar-sign'],
      ['Requested Text', 'message-square'],
      ['Call Back Later', 'calendar-days']
    ];
    let showMoreOutcomes = false;

    function rebuildScreens(){
      screens = ['rating'];
      if(data.rating !== "Didn't call") {
        screens.push('outcome');
        if(data.outcomes.includes('Not Interested')) screens.push('reason');
        screens.push('tags');
        screens.push('notes');
        screens.push('route');
      } else {
        screens.push('notes');
      }
    }

    function updateProgress(){
      const pct = ((screenIndex + 1) / screens.length) * 100;
      progress.style.width = `${pct}%`;
    }

    function slideTo(renderFn, direction='forward'){
      stage.classList.remove('slide-in-right','slide-in-left');
      stage.classList.add(direction === 'back' ? 'slide-out-right' : 'slide-out-left');
      setTimeout(() => {
        renderFn();
        stage.classList.remove('slide-out-left','slide-out-right');
        stage.classList.add(direction === 'back' ? 'slide-in-left' : 'slide-in-right');
        setTimeout(() => stage.classList.remove('slide-in-right','slide-in-left'), 220);
      }, 170);
    }

    function navRow({back=true,nextLabel='Continue',nextDisabled=false,onNext}){
      return `<div class="post-call-nav">
        ${back ? '<button class="pc-back" type="button"><i data-lucide="chevron-left"></i> Back</button>' : '<span></span>'}
        <button class="pc-next" type="button" ${nextDisabled?'disabled':''}>${nextLabel}<i data-lucide="chevron-right"></i></button>
      </div>`;
    }

    function render(){
      rebuildScreens();
      if(screenIndex >= screens.length) screenIndex = screens.length - 1;
      updateProgress();
      const screen = screens[screenIndex];

      if(screen === 'rating'){
        const ratingOptions = [
          ['thumbs-up','thumbs-up','Good'],
          ['thumbs-down','thumbs-down','Bad'],
          ['didnt-call','phone-off',"Didn't call"]
        ];
        stage.innerHTML = `
          <div class="pc-heading"><span class="pc-kicker">Call complete</span><h2>How did it go?</h2><p>Choose how the call went.</p></div>
          <div class="pc-rating-grid">
            ${ratingOptions.map(([cls,icon,label]) => `<button class="pc-rating ${cls} ${data.rating===label?'selected':''}" data-value="${label}" type="button"><i data-lucide="${icon}"></i><span>${label}</span></button>`).join('')}
          </div>
          ${navRow({back:false,nextDisabled:!data.rating})}`;
        stage.querySelectorAll('.pc-rating').forEach(btn => btn.addEventListener('click', () => {
          if (data.rating !== btn.dataset.value) {
            data.outcomes = [];
            data.reason = '';
            data.route = '';
            showMoreOutcomes = false;
          }
          data.rating = btn.dataset.value;
          if (data.rating === "Didn't call") data.tags = [];
          stage.querySelectorAll('.pc-rating').forEach(x => x.classList.toggle('selected', x===btn));
          stage.querySelector('.pc-next').disabled = false;
        }));
      }

      if(screen === 'outcome'){
        const choices = outcomeChoices[data.rating] || outcomeChoices.Good;
        // More is the sixth card, styled exactly like the other outcome cards.
        const visible = showMoreOutcomes ? [...choices, ...extraOutcomes] : choices;
        stage.innerHTML = `
          <div class="pc-heading"><span class="pc-kicker">Call details</span><h2>What happened?</h2><p>Select everything that applies to this call.</p></div>
          <div class="pc-option-grid">
            ${visible.map(([label,icon]) => `<button class="pc-option ${data.outcomes.includes(label)?'selected':''}" data-value="${label}" type="button"><i data-lucide="${icon}"></i><span>${label}</span></button>`).join('')}
            <button class="pc-option pc-outcome-more" type="button" aria-expanded="${showMoreOutcomes}"><i data-lucide="${showMoreOutcomes ? 'minus' : 'plus'}"></i><span>${showMoreOutcomes ? 'Less' : 'More'}</span></button>
          </div>
          ${navRow({back:false,nextDisabled:!data.outcomes.length})}`;
        stage.querySelectorAll('.pc-option[data-value]').forEach(btn => btn.addEventListener('click', () => {
          const value = btn.dataset.value;
          if(data.outcomes.includes(value)) data.outcomes = data.outcomes.filter(x => x !== value);
          else data.outcomes.push(value);

          if(!data.outcomes.includes('Not Interested')) data.reason = '';

          if (data.outcomes.includes('Not Interested')) data.route = 'notinterested';
          else if (data.outcomes.some(x => /follow up|call back later|requested text|requested email|needs more info/i.test(x))) data.route = 'callback';

          btn.classList.toggle('selected', data.outcomes.includes(value));
          stage.querySelector('.pc-next').disabled = !data.outcomes.length;
        }));
        stage.querySelector('.pc-outcome-more').addEventListener('click', () => {
          showMoreOutcomes = !showMoreOutcomes;
          render();
        });
      }

      if(screen === 'reason'){
        stage.innerHTML = `
          <div class="pc-heading"><span class="pc-kicker">Not interested</span><h2>Why weren’t they interested?</h2><p>This helps keep future outreach useful.</p></div>
          <div class="pc-list-options">
            ${reasonOptions.map(label => `<button class="pc-list-option ${data.reason===label?'selected':''}" data-value="${label}"><span>${label}</span><i data-lucide="check"></i></button>`).join('')}
          </div>
          ${navRow({nextDisabled:!data.reason})}`;
        stage.querySelectorAll('.pc-list-option').forEach(btn => btn.addEventListener('click', () => {
          data.reason = btn.dataset.value;
          stage.querySelectorAll('.pc-list-option').forEach(x => x.classList.toggle('selected', x===btn));
          stage.querySelector('.pc-next').disabled = false;
        }));
      }

      if(screen === 'tags'){
        stage.innerHTML = `
          <div class="pc-heading"><span class="pc-kicker">Organize the call</span><h2>Add tags</h2><p>Select any that apply. You can choose more than one.</p></div>
          <div class="pc-tag-options">
            ${tagOptions.map(label => `<button class="pc-tag ${data.tags.includes(label)?'selected':''}" data-value="${label}">${label}</button>`).join('')}
          </div>
          ${navRow({nextLabel:'Continue'})}`;
        stage.querySelectorAll('.pc-tag').forEach(btn => btn.addEventListener('click', () => {
          const value = btn.dataset.value;
          if(data.tags.includes(value)) data.tags = data.tags.filter(x => x!==value);
          else data.tags.push(value);
          btn.classList.toggle('selected');
        }));
      }

      if(screen === 'notes'){
        stage.innerHTML = `
          <div class="pc-heading"><span class="pc-kicker">Call notes</span><h2>Anything else?</h2><p>Notes are optional. Add anything you’ll want to remember later.</p></div>
          <textarea class="pc-notes" placeholder="Add notes (optional)…">${data.notes}</textarea>
          ${navRow({nextLabel: data.rating === "Didn't call" ? 'Save' : 'Continue'})}`;
        stage.querySelector('.pc-notes').addEventListener('input', e => data.notes = e.target.value);
      }

      if(screen === 'route'){
        stage.innerHTML = `
          <div class="pc-heading"><span class="pc-kicker">Last step</span><h2>Where should this lead go?</h2><p>Choose what should happen to this lead after this call.</p></div>
          <div class="pc-option-grid">
            <button class="pc-option ${data.route==='callback'?'selected':''}" data-route="callback" type="button">
              <i data-lucide="phone-forwarded"></i><span>Call Back</span>
            </button>
            <button class="pc-option ${data.route==='notinterested'?'selected':''}" data-route="notinterested" type="button">
              <i data-lucide="circle-x"></i><span>Not Interested</span>
            </button>
          </div>
          ${navRow({nextLabel:'Save Call',nextDisabled:!data.route})}`;

        stage.querySelectorAll('[data-route]').forEach(btn => btn.addEventListener('click', () => {
          data.route = btn.dataset.route;
          stage.querySelectorAll('[data-route]').forEach(x => x.classList.toggle('selected', x === btn));
          stage.querySelector('.pc-next').disabled = false;
        }));
      }

      const back = stage.querySelector('.pc-back');
      if(back) back.addEventListener('click', () => {
        screenIndex = Math.max(0, screenIndex - 1);
        slideTo(render, 'back');
      });

      const next = stage.querySelector('.pc-next');
      if(next) next.addEventListener('click', () => {
        if(next.disabled) return;
        if(screen === 'notes' && data.rating === "Didn't call") return showConfirmation();
        if(screen === 'route') return showConfirmation();
        rebuildScreens();
        screenIndex++;
        slideTo(render, 'forward');
      });
      lucide.createIcons();
    }

    function showConfirmation(){
      progress.style.width = '100%';
      stage.className = 'post-call-stage confirmation-stage';
      stage.innerHTML = `
        <div class="pc-confirm">
          <div class="pc-check"><i data-lucide="check"></i></div>
          <h2>Call saved</h2>
          <p>Your call result${data.tags.length ? ', tags' : ''}${data.notes.trim() ? ', notes' : ''} and transcript were saved.</p>
          <div class="pc-confirm-summary">
            <strong>${data.rating}</strong>
            ${data.outcomes.length ? `<span>${data.outcomes.join(' • ')}</span>` : ''}
            ${data.reason ? `<span>${data.reason}</span>` : ''}
            ${connectedSeconds ? `<span>${Math.floor(connectedSeconds/60)}m ${connectedSeconds%60}s call</span>` : '<span>No connected call time</span>'}
          </div>
          <button class="pc-done" type="button">Done</button>
        </div>`;
      stage.querySelector('.pc-done').addEventListener('click', async () => {
        const crmId = new URLSearchParams(location.search).get('crm_id') || null;

        if (data.rating !== "Didn't call" && connectedSeconds > 0) {
          const client = window.steadyHandsCRMClient;

          if (client && crmId && data.route) {
            const { data: currentLead } = await client
              .from('crm')
              .select('notes')
              .eq('id', crmId)
              .maybeSingle();

            const noteLine = data.notes.trim()
              ? '[' + new Date().toLocaleString() + '] ' + data.notes.trim()
              : '';

            const currentNotes = (currentLead?.notes || '').trim();
            const nextNotes = noteLine
              ? [currentNotes, noteLine].filter(Boolean).join('\n')
              : currentNotes;

            const crmUpdate = data.route === 'notinterested'
              ? {
                  stage: 'notinterested',
                  outcome: 'Not Interested',
                  lastcalled: new Date().toISOString(),
                  notes: nextNotes
                }
              : {
                  stage: 'outreach',
                  outcome: 'Call Back',
                  lastcalled: new Date().toISOString(),
                  notes: nextNotes
                };

            const { error } = await client
              .from('crm')
              .update(crmUpdate)
              .eq('id', crmId);

            if (error) {
              console.error('Unable to update lead after call:', error);
              return alert('The call was saved, but the lead could not be moved. Please try again.');
            }
          }

          await window.callcenterRecordCall?.({
            crmId,
            duration: connectedSeconds,
            outcome: [
              data.rating,
              ...data.outcomes,
              data.route === 'callback' ? 'Call Back' : data.route === 'notinterested' ? 'Not Interested' : ''
            ].filter(Boolean).join(' • ')
          });
        }

        location.href='index.html';
      });
      lucide.createIcons();
    }

    rebuildScreens();
    render();
  }

  lucide.createIcons();
})();
</script>
</body>
</html>
