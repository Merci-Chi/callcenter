<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#102945"/>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Outreach" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="192x192" href="images/icon-192.png" /><title>Sign In • Outreach</title>
<link rel="stylesheet" href="styles.css"/>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  .forgot-password{
    appearance:none;
    border:0;
    background:transparent;
    color:inherit;
    font:inherit;
    padding:0;
    margin:-2px 0 2px auto;
    display:block;
    cursor:pointer;
    opacity:.78;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .forgot-password:hover{opacity:1}
  .forgot-password:disabled{opacity:.45;cursor:not-allowed}

  .login-brand-icon{
    overflow:hidden;
    background:#102945;
    padding:0;
  }
  .login-brand-icon img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    border-radius:inherit;
  }

  .save-email-option{
    display:flex;
    align-items:center;
    gap:9px;
    width:max-content;
    max-width:100%;
    margin:2px 0 8px;
    color:#53677c;
    font-size:12px;
    font-weight:750;
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
  }
  .save-email-option input{
    position:absolute;
    opacity:0;
    pointer-events:none;
  }
  .save-email-check{
    width:19px;
    height:19px;
    flex:0 0 19px;
    border:1.5px solid #b8c6d5;
    border-radius:6px;
    background:#fff;
    display:grid;
    place-items:center;
    color:transparent;
    transition:.15s ease;
  }
  .save-email-check svg{
    width:13px;
    height:13px;
    stroke-width:3;
  }
  .save-email-option input:checked + .save-email-check{
    background:#1677e8;
    border-color:#1677e8;
    color:#fff;
  }
  .save-email-option input:focus-visible + .save-email-check{
    outline:2px solid rgba(22,119,232,.25);
    outline-offset:2px;
  }
</style>
  <script src="app-update.js" defer></script>
</head><body>
<div class="login-page"><div class="login-panel">
<div class="login-brand"><div class="login-brand-icon"><img src="images/icon-192.png" alt="Steady Hands logo" /></div><span>STEADY HANDS</span></div>
<div class="login-title"><h1 id="loginHeading">Welcome back</h1><p id="loginSubheading">Sign in to continue to Outreach.</p></div>
<form id="loginForm" class="login-form">
<label for="loginEmail">Email address</label><div class="login-field"><i data-lucide="mail"></i><input id="loginEmail" type="email" name="email" placeholder="name@steadyhandsop.com" autocomplete="username" required/></div>
<label for="loginPassword">Password</label><div class="login-field"><i data-lucide="lock-keyhole"></i><input id="loginPassword" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required/><button type="button" id="showPassword" aria-label="Show password"><i data-lucide="eye"></i></button></div>
<label class="save-email-option" for="saveEmailToDevice">
  <input id="saveEmailToDevice" type="checkbox" checked />
  <span class="save-email-check" aria-hidden="true"><i data-lucide="check"></i></span>
  <span>Save email to this device</span>
</label>
<button type="button" id="forgotPassword" class="forgot-password">Forgot password?</button>
<div id="loginMessage" class="login-message" role="status" aria-live="polite"></div>
<button type="submit" id="signInButton" class="login-submit">Sign in <i data-lucide="arrow-right"></i></button>
</form><div class="login-foot">Authorized team access only</div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="login.js"></script>
</body></html>
